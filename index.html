<!DOCTYPE html>
<html>

    <head>
        <title>CV Santeri</title>
        <link rel="stylesheet" href="./index.css" />
    </head>

    <body>

        <div id="heading-container">

            <div id="image-container">
                <img id="profile-pic" src="./image.png" />
            </div>

            <div id="name-and-description-container">
                <h1>Santeri Sydänmetsä</h1>
                <p>
                    Tähän tulee lyhyt kuvaus itsestäni.
                    <br>
                    Minä olen Helsingissä asusteleva ohjelmistokehittäjä...
                </p>
            </div>

        </div>

        <button id="counter-button">
            Painettu 0 kertaa    
        </button>

        <script>
            const button = document.getElementById("counter-button");
            let count = 0;

            button.onclick = () => {
                count += 1;

                if (count === 10) {
                    count = 0;
                }

                button.innerText = `Painettu ${count} kertaa`;
            };
        </script>

    </body>

</html>
