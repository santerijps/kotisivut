<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salasanan Validointi</title>
</head>
<body>
    
    <h1>Salasanan Validointi</h1>
    <a href="index.html">Takaisin etusivulle</a>
    <br>
    <br>

    <input type="password" spellcheck="false" id="salasana">
    <button id="vaihto">Näytä salasana</button>

    <ul>
        <li id="li-pituus">Salasanan pituus 5-10 merkkiä</li>
        <li id="li-iso-kirjain">Vähintään yksi iso kirjain</li>
        <li id="li-pieni-kirjain">Vähintään yksi pieni kirjain</li>
        <li id="li-numero">Vähintään yksi numero</li>
        <li id="li-erikoismerkki">Vähintään yksi erikoismerkki (!?@_)</li>
    </ul>

    <script>

        const input = document.getElementById("salasana");
        const button = document.getElementById("vaihto");
        const liPituus = document.getElementById("li-pituus");
        const liIsoKirjain = document.getElementById("li-iso-kirjain");
        const liPieniKirjain = document.getElementById("li-pieni-kirjain");
        const liNumero = document.getElementById("li-numero");
        const liErikoisMerkki = document.getElementById("li-erikoismerkki");

        function onButtonClick() {
            if (input.type === "password") {
                input.type = "text";
                button.innerText = "Piilota salasana";
            }
            else {
                input.type = "password";
                button.innerText = "Näytä salasana";
            }
        }

        function checkPassword() {
            /** @type {string} */
            const password = input.value;

            // Onko pituus vähemmän kuin 5 tai enemmän kuin 10?
            if (password.length < 5 || password.length > 10) {
                liPituus.style.color = "red";
            }
            else {
                liPituus.style.color = "green";
            }

            // Onko salasanassa isoja kirjaimia?
            if (/[A-Z]/.test(password)) {
                liIsoKirjain.style.color = "green";
            }
            else {
                liIsoKirjain.style.color = "red";
            }

            // Onko salasanassa pieniä kirjaimia?
            if (/[a-z]/.test(password)) {
                liPieniKirjain.style.color = "green";
            }
            else {
                liPieniKirjain.style.color = "red";
            }

            // Onko salasanassa numeroita?
            if (/[0-9]/.test(password)) {
                liNumero.style.color = "green";
            }
            else {
                liNumero.style.color = "red";
            }

            // Onko salasanassa erikoismerkkejä?
            if (/[!\?\-\.\_#\"\']/.test(password)) {
                liErikoisMerkki.style.color = "green";
            }
            else {
                liErikoisMerkki.style.color = "red";
            }
        }

        function onInput2() {
            /** @type {string} */
            const password = input.value;
            const erikoismerkit = ["!", "?"];

            liPituus.style.color = "red";
            liIsoKirjain.style.color = "red";
            liPieniKirjain.style.color = "red";
            liNumero.style.color = "red";

            if (5 <= password.length && password.length <= 10) {
                liPituus.style.color = "green";
            }

            for (let i = 0; i < password.length; i++) {
                const code = password.charCodeAt(i);
                if (65 <= code && code <= 90) {
                    liIsoKirjain.style.color = "green";
                }
                else if (97 <= code && code <= 122) {
                    liPieniKirjain.style.color = "green";
                }
                else if (48 <= code && code <= 57) {
                    liNumero.style.color = "green";
                }
                if (erikoismerkit.includes(password[i])) {
                    liErikoisMerkki.style.color = "green";
                }
            }
        }

        button.onclick = onButtonClick;
        input.oninput = onInput2;

        checkPassword();

    </script>

</body>
</html>
